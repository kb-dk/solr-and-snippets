services:
  solr:
    image: solr:8.11.1
    container_name: text-service-solr
    ports:
      - '8983:8983'
    environment:
      # Default heap (512m) OOMs while indexing the full build tree; Solr's
      # oom_solr.sh then SIGKILLs the JVM (exit 137). Give it room.
      SOLR_HEAP: 2g
    volumes:
      - ./solr/adl/conf:/opt/solr/server/solr/configsets/text-retriever-core/conf:ro
    command: solr-precreate text-retriever-core /opt/solr/server/solr/configsets/text-retriever-core/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr"]
      interval: 10s
      timeout: 5s
      retries: 5

  exist:
    image: existdb/existdb:4.8.0
    container_name: text-service-exist
    ports:
      - '8080:8080'
    volumes:
      - exist-data:/exist/webapp/WEB-INF/data

  app:
    image: text-service-app:latest
    container_name: text-service-app
    depends_on:
      solr:
        condition: service_healthy
      exist:
        condition: service_healthy
    command: sh -c "bundle exec rails db:create db:migrate && bundle exec puma -C config/puma.rb"
    ports:
      - '3000:3000'
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      SOLR_URL: http://solr:8983/solr/text-retriever-core/
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-docker_secret_key_base_change_me}
      RAILS_SERVE_STATIC_FILES: 'true'
      RAILS_LOG_TO_STDOUT: 'true'
    restart: unless-stopped

  tools:
    # `docker compose run --rm tools <command>`.
    build:
      context: .
      dockerfile: docker/tools/Dockerfile
    image: text-service-tools:latest
    container_name: text-service-tools
    depends_on:
      solr:
        condition: service_healthy
      exist:
        condition: service_healthy
    working_dir: /workspace/solr-and-snippets
    volumes:
      - ..:/workspace
    environment:
      EXIST_HOST: exist
      EXIST_PORT: '8080'
      SOLR_HOST: solr
      SOLR_PORT: '8983'
      SOLR_COLLECTION: text-retriever-core
    command: sleep infinity

volumes:
  exist-data:
